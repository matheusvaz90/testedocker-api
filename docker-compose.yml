services:
   db:
    image: postgres:16.14
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - volume-db:/var/lib/postgresql/data
    healthcheck:  
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - todonet

   to-do-back: 
    build: .
    ports:
    - 8080:8080
    restart: unless-stopped
    environment:
      DATABASE_URL: "Host=db;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db: 
        condition: service_healthy
    networks:
      - todonet
volumes:
  volume-db:
networks:
  todonet:
    external: true